services:
  postgres:
    image: postgres:16
    container_name: niriksh-postgres
    environment:
      POSTGRES_DB: niriksh
      POSTGRES_USER: niriksh
      POSTGRES_PASSWORD: niriksh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: niriksh-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
